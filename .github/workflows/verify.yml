permissions:
  contents: write

name: verify

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 130

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up PyPy
      uses: actions/setup-python@v5
      with:
        python-version: 'pypy3.11'

    - name: Check Library Checker submission code
      run: python library-checker-submitcode/generate.py --check

    - name: Install lxml build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libxml2-dev libxslt1-dev

    - name: Install dependencies
      run: python -m pip install -r library-checker-submitcode/requirements-verify.txt

    - name: Get Library Checker revision
      id: library-checker-version
      run: git ls-remote https://github.com/yosupo06/library-checker-problems.git HEAD | awk '{print "commit=" $1}' >> "$GITHUB_OUTPUT"

    - name: Restore Library Checker cases and generators
      id: library-checker-cache
      uses: actions/cache/restore@v4
      with:
        path: |
          .verify-helper/cache
          ~/.cache/online-judge-tools/library-checker-problems
        key: ${{ runner.os }}-library-checker-v1-${{ steps.library-checker-version.outputs.commit }}-${{ hashFiles('library-checker-submitcode/src/**/*.py', 'library-checker-submitcode/generate.py') }}
        restore-keys: |
          ${{ runner.os }}-library-checker-v1-${{ steps.library-checker-version.outputs.commit }}-

    # Keep verification timestamps out of main so CI does not diverge from local clones.
    - name: Restore verification timestamps
      uses: actions/cache/restore@v4
      with:
        path: .verify-helper/timestamps.remote.json
        key: ${{ runner.os }}-verification-timestamps-v1-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          ${{ runner.os }}-verification-timestamps-v1-

    - name: Verify with official cases
      env:
        YUKICODER_TOKEN: ${{ secrets.YUKICODER_TOKEN }}
      # oj-verify pushes timestamps to main when GITHUB_TOKEN is present.
      run: env -u GITHUB_TOKEN oj-verify run --timeout inf

    - name: Save verification timestamps
      if: always()
      uses: actions/cache/save@v4
      with:
        path: .verify-helper/timestamps.remote.json
        key: ${{ runner.os }}-verification-timestamps-v1-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

    # oj-verify docs switches to gh-pages and removes the working files.
    - name: Save Library Checker cases and generators
      if: always() && steps.library-checker-cache.outcome == 'success' && steps.library-checker-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          .verify-helper/cache
          ~/.cache/online-judge-tools/library-checker-problems
        key: ${{ steps.library-checker-cache.outputs.cache-primary-key }}

    - name: Publish verification documents
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_PAT: ${{ secrets.GH_PAT }}
      run: oj-verify docs
