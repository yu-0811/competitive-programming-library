repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.11
    hooks:
      - id: ruff-format
        exclude: ^(tatyam_set/|library-checker-submitcode/(?!generate\.py$|src/)|tests/library_checker/official/)
      - id: ruff 
        exclude: ^(tatyam_set/|library-checker-submitcode/(?!generate\.py$|src/)|tests/library_checker/official/)
        args: [ --fix ]
  - repo: local
    hooks:
      - id: generate-library-checker-submitcode
        name: Generate Library Checker submission code
        entry: python3 library-checker-submitcode/generate.py
        language: system
        pass_filenames: false
        files: ^(algorithm_library/python/|library-checker-submitcode/|tests/library_checker/official/)
